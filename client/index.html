<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find and manage academic files by department, course, and batch." />
    <meta name="theme-color" content="#2848d6" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ISU Portal" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Academic File Portal</title>

    <!--
      Microsoft Clarity is loaded HERE, in <head>, and not from the app code.

      This is Microsoft's recommended integration, and it matters most on a
      phone: the app bundle is megabytes and can take seconds to parse and
      mount on a slow connection, so a Clarity that only starts from a React
      effect misses the beginning of the visit — and misses short visits
      entirely. An async, deferring-free tag in <head> starts the SDK in
      parallel with the bundle instead.

      The project ID and switch are injected at build time from the environment
      (VITE_CLARITY_PROJECT_ID / VITE_CLARITY_ENABLED). When the ID is blank —
      or the flag is "false", or the placeholder was not replaced because no
      value was configured — nothing is loaded at all, and no request leaves the
      browser. Nothing sensitive is ever passed: the SDK only gets an internal,
      non-sensitive identifier from src/analytics/clarity.js, and input content
      is masked.
    -->
    <script>
      (function () {
        var projectId = '%VITE_CLARITY_PROJECT_ID%';
        var enabled = '%VITE_CLARITY_ENABLED%';
        if (!projectId || projectId.charAt(0) === '%' || enabled === 'false') return;
        (function (c, l, a, r, i, t, y) {
          if (l.getElementById('clarity-script')) return;
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r);
          t.async = 1;
          t.src = 'https://www.clarity.ms/tag/' + i;
          t.id = 'clarity-script';
          y = l.getElementsByTagName(r)[0];
          if (y && y.parentNode) y.parentNode.insertBefore(t, y);
          else l.head.appendChild(t);
        })(window, document, 'clarity', 'script', projectId);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
